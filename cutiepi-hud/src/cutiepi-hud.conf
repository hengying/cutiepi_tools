# CutiePi HUD 配置（系统级默认值）
#
# 个人覆盖请写到 ~/.config/cutiepi-hud/config.ini（cutiepi-hud calibrate 会自动写）。
# 改完重启服务生效：systemctl --user restart cutiepi-hud

[display]
# 输出名。auto = 自动挑 DSI-* 的那个
output = auto
# auto / wayland / x11
backend = auto
# 如果真机上左右旋转方向反了（该横屏时竖着、该竖屏时横着），把这里改成 true
# CutiePi 实测：不需要（角度值本身就是标定出来的真实 transform）
swap_lr = false
# X11 下是否同步触摸屏坐标（Wayland 由合成器自动处理）
touch_matrix = true

[orientation]
# 关掉就完全不自动旋转
enabled = true
# 采样周期（毫秒）
poll_ms = 250
# 主轴占比阈值：低于它认为姿态不明确，不切换
threshold = 0.35
# Z 轴占比超过它认为平板平放（屏幕朝上/朝下），保持当前方向
flat_threshold = 0.75
# 连续多少次采样一致才切换（防抖）
confirm = 3
# 如果加速度计读数轴装反了，可以在这里换轴/取反
swap_xy = false
invert_x = false
invert_y = false
# 「重力落在哪根轴上」-> 姿态。第一次装机请运行 cutiepi-hud calibrate 自动填写
normal_axis = y-
left_up_axis = x-
bottom_up_axis = y+
right_up_axis = x+
# 指定 IIO 设备，auto = 自动
device = auto
# 姿态 -> 画面需要顺时针旋转的角度
# 下面这组是 2026-11-03 在 CutiePi CM4 真机上标定出来的实测值
deg_normal = 180
deg_left_up = 270
deg_bottom_up = 0
deg_right_up = 90

[mcu]
# auto = 自动探测 /dev/serial0、/dev/ttyS0 等
port = auto
baud = 115200
# 电量电压的滑动平均点数
smoothing = 15
# 6 秒长按电源键时是否替用户执行关机（需要 sudoers 规则，install.sh 会装）
shutdown_confirm = true
# 长按后先弹确认对话框（true）还是直接关机（false）
# 对话框默认 15 秒内没有确认就自动取消
shutdown_dialog = true
shutdown_dialog_timeout = 15
# 连按两下电源键也直接弹关机框（不用按住 6 秒）；窗口单位毫秒
double_press_dialog = true
double_press_ms = 700
# 单按电源键做什么：toggle=息屏/亮屏（默认）/ dialog=直接弹关机框 / none=不做
short_press_action = toggle
# 短按电源键是否开关背光（需要 udev 规则给 video 组写 bl_power 的权限）
# 默认打开：按一下息屏、再按一下亮屏
screen_toggle = true

[hud]
enabled = true
# 电池显示在哪儿：
#   tray    = 系统状态栏（任务栏）的托盘图标区（默认，推荐）
#   overlay = 独立角标窗口（备用：面板没有托盘图标区时）
#   both    = 两个都显示
#   off     = 不显示
mode = tray
# 托盘图标尺寸（像素）。面板会按自己的图标高度再缩放
icon_size = 32
# 想让图标就是电池图形而不是数字，改成 battery
icon_style = number
# 图标颜色：
#   auto  = 跟随 GTK 主题前景色（推荐）
#   light = 面板是浅色，画深色图标
#   dark  = 面板是深色，画浅色图标
# 如果图标"看不见"（和面板底色撞了），就手工指定 light 或 dark。
icon_color = auto
# 状态栏上是否显示亮度图标（太阳），点一下弹 1..15 的滑块
brightness_icon = true
# 只有 overlay 模式用得到：备用叠加层程序与位置
overlay = /opt/cutiepi-hud/hud-overlay
margin_top = 40
margin_right = 8
